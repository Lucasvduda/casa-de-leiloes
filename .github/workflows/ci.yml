name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leilao
          POSTGRES_PASSWORD: leilao
          POSTGRES_DB: leilao
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leilao -d leilao"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Os testes de integracao usam este Postgres real (concorrencia de lances precisa de lock de verdade).
      TEST_DATABASE_URL: postgres://leilao:leilao@localhost:5432/leilao
      INTEGRITY_SECRET: ci-only-secret-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
