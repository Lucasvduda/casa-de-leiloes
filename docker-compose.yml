services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leilao
      POSTGRES_PASSWORD: leilao
      POSTGRES_DB: leilao
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U leilao -d leilao']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgres://leilao:leilao@db:5432/leilao
      # Somente para demonstracao local. Em producao use um segredo proprio (>= 32 caracteres).
      INTEGRITY_SECRET: ${INTEGRITY_SECRET:-troque-este-segredo-local-0123456789abcdef}
      SEED_ON_BOOT: 'true'
    ports:
      - '3000:3000'

volumes:
  pgdata:
